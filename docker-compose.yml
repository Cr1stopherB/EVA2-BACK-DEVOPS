version: '3.8'

services:
  innovatech-backend:
    build: .
    container_name: innovatech-backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=alumno
      - DB_PASSWORD=alumno123
      - DB_NAME=innovatech
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: innovatech-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=innovatech
      - MYSQL_USER=alumno
      - MYSQL_PASSWORD=alumno123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: