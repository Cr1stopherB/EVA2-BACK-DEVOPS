version: '3.8'

services:
  tienda-backend:
    build: .
    container_name: tienda-backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=alumno
      - DB_PASSWORD=alumno123
      - DB_NAME=tienda_perritos
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: tienda-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=tienda_perritos
      - MYSQL_USER=alumno
      - MYSQL_PASSWORD=alumno123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: